<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Summarize Notes | AI Learning & Career Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="app-container">

        <header class="header">

            <h1>Summarize Notes</h1>

            <p>
                Turn your study notes into simple,
                easy-to-understand points.
            </p>

        </header>


        <main class="dashboard">

            <div class="feature-card">

                <div class="icon">📝</div>

                <h2>Your Notes</h2>

                <p>
                    Paste your study notes below and
                    let AI create a clear summary.
                </p>


                <form action="/summarize-notes"
                      method="POST"
                      class="ai-form">

                    <textarea
                        name="notes"
                        placeholder="Paste your notes here..."
                        required></textarea>

                    <button type="submit"
                            class="ai-button">
                        Summarize Notes
                    </button>

                </form>

            </div>


            {% if summary %}

            <div class="answer-card">

                <div class="answer-header">

                    <div class="answer-icon">
                        ✨
                    </div>

                    <div>

                        <h2>AI Summary</h2>

                        <p>
                            Your notes have been simplified.
                        </p>

                    </div>

                </div>


                <div class="answer-content">
                    {{ summary }}
                </div>

            </div>

            {% endif %}

        </main>


        <footer>

            <a href="/learning">
                ← Back to Learning
            </a>

        </footer>

    </div>

</body>

</html>
